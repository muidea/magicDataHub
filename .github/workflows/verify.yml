name: Verify three services
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: '1.94.0'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source:
    name: Source checks (integration runs on dispatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Check Rust formatting without external source checkouts
        shell: bash
        run: |
          mapfile -d '' sources < <(git ls-files -z -- '*.rs')
          test "${#sources[@]}" -gt 0
          rustfmt --edition 2024 --check "${sources[@]}"
      - name: Check Python syntax and local evidence gate
        run: |
          python3 - <<'PY'
          import pathlib
          for folder in ['scripts', 'tests']:
              for path in pathlib.Path(folder).rglob('*.py'):
                  compile(path.read_bytes(), str(path), 'exec')
          PY
          python3 -B -m unittest discover -s tests -p test_contract_evidence.py -v
          python3 -B -m unittest discover -s tests -p test_source_organization.py -v
      - name: Validate Compose definition
        env:
          MDH_IMAGE_PREFIX: mdh-source-check
        run: docker compose -f docker/compose.yaml config --quiet
  # Full three-service integration, JDBC workflow, and container image acceptance require
  # locally compiled custom DuckDB 2.0.0 extensions and are executed offline/locally via
  # scripts/check-federation.sh, scripts/check-workflow.sh, and scripts/build-images.py
  # rather than in online GitHub Actions.
